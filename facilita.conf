# FacilitaEstudos — servido pelo nginx do Mailu (front)
# aplicação canônica: facilitaestudos.com.br  -> /facilita
# legado: app.facilitaestudos.com.br redireciona para o domínio canônico
server {
  listen 80;
  server_name facilitaestudos.com.br www.facilitaestudos.com.br;
  location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://facilitaestudos.com.br$request_uri; }
}
server {
  listen 443 ssl;
  http2 on;
  server_name www.facilitaestudos.com.br;
  ssl_certificate     /facilita-certs/live/facilitaestudos.com.br/fullchain.pem;
  ssl_certificate_key /facilita-certs/live/facilitaestudos.com.br/privkey.pem;
  return 301 https://facilitaestudos.com.br$request_uri;
}
server {
  listen 443 ssl;
  http2 on;
  server_name facilitaestudos.com.br;
  ssl_certificate     /facilita-certs/live/facilitaestudos.com.br/fullchain.pem;
  ssl_certificate_key /facilita-certs/live/facilitaestudos.com.br/privkey.pem;
  root /facilita; index index.html; charset utf-8;
  client_max_body_size 105m;
  gzip on; gzip_types text/css application/javascript image/svg+xml;
  add_header X-Content-Type-Options nosniff;
  add_header X-Frame-Options SAMEORIGIN always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  server_tokens off;
  location /api/ {
    # The Mailu nginx container reaches the private frontend through the
    # Docker host gateway. Confirm this bridge address in the VPS before deploy.
    proxy_pass http://172.17.0.1:8090/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_connect_timeout 5s;
    proxy_read_timeout 60s;
  }
  location /uploads/ {
    proxy_pass http://172.17.0.1:8090/uploads/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / { try_files $uri $uri/ /index.html; }
}
server {
  listen 80;
  server_name app.facilitaestudos.com.br;
  location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
  location / { return 301 https://facilitaestudos.com.br$request_uri; }
}
server {
  listen 443 ssl;
  http2 on;
  server_name app.facilitaestudos.com.br;
  ssl_certificate     /facilita-certs/live/app.facilitaestudos.com.br/fullchain.pem;
  ssl_certificate_key /facilita-certs/live/app.facilitaestudos.com.br/privkey.pem;
  return 301 https://facilitaestudos.com.br$request_uri;
}
